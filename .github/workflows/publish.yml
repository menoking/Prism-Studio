name: Build and publish release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prism-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install dependencies and restore locked local fonts
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/fetch-fonts.py --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and check
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/package.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -LiteralPath fonts -DestinationPath release/fonts.zip -Force
      - name: Publish current version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Get-Content manifest.json -Raw | ConvertFrom-Json).version
          $assets = @("release/prism-studio-$version.zip", 'release/fonts.zip', 'main.js', 'manifest.json', 'styles.css', 'release/Install-Prism.ps1', 'release/SHA256.json')
          gh release view $version --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $version @assets --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $version @assets --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Prism Studio $version" --notes-file RELEASE-NOTES.md --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
